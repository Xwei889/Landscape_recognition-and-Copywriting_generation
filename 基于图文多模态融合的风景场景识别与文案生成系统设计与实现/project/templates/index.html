<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>识景秒出文案机</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div id="app">
    <div class="top-nav">
        <div class="nav-logo">
            <span>🌄</span>
            风景场景识别与文案生成系统
        </div>
        <div class="nav-menu">
            <div class="nav-item" :class="{active:activeTab==='home'}" @click="activeTab='home'">首页</div>
            <div class="nav-item" :class="{active:activeTab==='author'}" @click="activeTab='author'">作者介绍</div>
            <div class="nav-item" :class="{active:activeTab==='about'}" @click="activeTab='about'">系统说明</div>
        </div>
    </div>

    <main class="main-content">
        <div class="content-card">
            <!-- 首页：左右两栏布局 -->
            <div v-if="activeTab==='home'">
                <h1 class="page-title">风景场景识别与文案生成</h1>

                <div class="two-column">
                    <!-- 左侧：上传区域 -->
                    <div class="col">
                        <div class="upload-section">
                            <label class="form-label">选择风景图片</label>
                            <input type="file" accept="image/*" @change="handleFileChange" class="file-input" />
                            <img v-if="previewUrl" :src="previewUrl" class="image-preview" alt="预览">
                        </div>

                        <div class="upload-section">
                            <label class="form-label">选择文案风格</label>
                            <select v-model="selectedStyle" class="form-select">
                                <option value="治愈">治愈</option>
                                <option value="文艺">文艺</option>
                                <option value="伤感">伤感</option>
                            </select>
                        </div>

                        <button @click="generateCaption" :disabled="loading||!imageBlob" class="submit-btn">
                            <span v-text="loading?'⏳ 正在识别生成中...':'🚀 上传并生成文案'"></span>
                        </button>
                    </div>

                    <!-- 右侧：结果区域 -->
                    <div class="col">
                        <div v-if="result.scene" class="result-card">
                            <h3 class="result-title">✅ 识别结果</h3>
                            <div class="result-item">
                                <strong>识别场景：</strong> <span v-text="result.scene"></span>
                            </div>
                            <div class="result-item">
                                <strong>生成文案：</strong> <span v-text="result.caption"></span>
                            </div>
                        </div>

                        <div v-else class="empty-box">
                            <div>📷 上传图片并生成文案</div>
                            <div>结果将在这里显示</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 作者介绍 -->
            <div v-if="activeTab==='author'">
                <h1 class="page-title">作者介绍</h1>
                <div class="author-card">
                    <div class="author-avatar">👨‍🎓</div>
                    <div class="author-info">
                        <h2>徐佳伟</h2>
                        <p>闽江学院 人工智能专业</p>
                        <p>毕业设计：多模态风景识别文案生成系统</p>
                    </div>
                </div>
            </div>

            <!-- 系统说明 -->
            <div v-if="activeTab==='about'">
                <h1 class="page-title">系统功能说明</h1>
                <div class="info-section">
                    <h3>核心功能</h3>
                    <ul>
                        <li>本地图片上传预览</li>
                        <li>智能风景场景分类识别</li>
                        <li>多风格文案一键生成</li>
                    </ul>
                </div>
            </div>
        </div>
    </main>
</div>

<script src="/static/js/app.js"></script>
</body>
</html>
